name: Fix LifeFlow signup handler

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch signup function
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("app/index.html")
          s = p.read_text()
          old = """async function signup(){let email=$('email').value.trim(),password=$('pass').value;if(!email||password.length<6)return msg('Use an email and 6+ character password.');let{error}=await db.auth.signUp({email,password,options:{emailRedirectTo:location.href}});msg(error?error.message:'Account created. Check your email if confirmation is enabled.')}"""
          new = """async function signup(){try{let email=$('email').value.trim(),password=$('pass').value;if(!email||password.length<6)return msg('Use an email and 6+ character password.');msg('Creating account...');let{data,error}=await db.auth.signUp({email,password,options:{emailRedirectTo:location.href}});if(error)return msg('Signup error: '+error.message);msg(data.session?'Account created successfully.':'Account created. Check your email to confirm your account.')}catch(e){msg('Signup error: '+(e?.message||'Please try again.'))}}"""
          if old not in s:
              raise SystemExit("Expected signup function was not found")
          p.write_text(s.replace(old,new))
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/index.html
          git commit -m "Fix signup error handling" || exit 0
          git push